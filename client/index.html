<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--
    Assistant only, and weight 500 included.
    Rubik belongs to the parent portal, which loads its own; Varela Round was
    dropped from the type scale but stayed in this tag and on the login screen,
    so the first thing anyone saw contradicted the decision. Weight 500 was in
    use in the rail and the figures and had never been fetched, so the browser
    was synthesising it.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!--
    Added so "התקן את האפליקציה" is a true sentence. Adding this to a home
    screen previously produced an unnamed square with a screenshot in it, which
    is not something you ask an employee to do.

    A manifest and icons only — deliberately NO service worker. A worker is what
    makes an installed page keep serving last week's build after a deploy, and
    the people on the receiving end here have no idea what a hard refresh is.
    Everything below buys the icon, the name and the full-screen window; none of
    it needs to cache a thing.
  -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- The clay the app actually uses. #f59e0b is the orange that failed contrast
       at 2.2:1 and design-tokens.test.js forbids by name. -->
  <meta name="theme-color" content="#B4540A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- iOS reads its own vendor-prefixed pair; without them Safari opens the
       home-screen icon in a browser tab with an address bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="גן החלומות" />

  <title>גן החלומות - ניהול חכם</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
