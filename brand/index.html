<!doctype html>
<meta charset="utf-8">
<title>חלום — לוגו ראשוני</title>
<style>
  body{font-family:Assistant,Arial,sans-serif;direction:rtl;background:#F7FAFC;color:#16324A;margin:0;padding:40px}
  h1{font-size:22px;margin:0 0 6px} p.sub{color:#5B7387;margin:0 0 32px}
  .row{background:#fff;border:1px solid #E2EAF0;border-radius:16px;padding:28px;margin-bottom:18px}
  .row.dark{background:#0E2233;border-color:#1E3A50}
  .row h2{font-size:13px;color:#8AA1B2;font-weight:600;margin:0 0 18px;letter-spacing:.04em}
  .sizes{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .swatch{display:flex;gap:12px;margin-top:8px}
  .chip{width:64px;height:64px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#fff;padding-bottom:6px;font-family:monospace}
</style>
<h1>חלום</h1>
<p class="sub">לוגו ראשוני — מערכת לניהול גני ילדים</p>

<div class="row"><h2>לוגו מלא / רקע בהיר</h2><img src="halom-logo.svg" width="380"></div>
<div class="row dark"><h2>לוגו מלא / רקע כהה</h2><img src="halom-logo-dark.svg" width="380"></div>
<div class="row"><h2>סמל בלבד — אייקון, פאביקון, אפליקציה</h2>
  <div class="sizes">
    <img src="halom-mark.svg" width="96"><img src="halom-mark.svg" width="56">
    <img src="halom-mark.svg" width="32"><img src="halom-mark.svg" width="16">
  </div>
</div>
<div class="row"><h2>צבעים</h2>
  <div class="swatch">
    <div class="chip" style="background:#2BB6A3">2BB6A3</div>
    <div class="chip" style="background:#2E7BC4">2E7BC4</div>
    <div class="chip" style="background:#16324A">16324A</div>
    <div class="chip" style="background:#5B7387">5B7387</div>
  </div>
</div>
