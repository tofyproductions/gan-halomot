<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GanFlow — קונסולת לקוחות</title>
<style>
  :root{
    --bg:#F4F7FA; --card:#fff; --line:#E2EAF0; --ink:#16324A; --dim:#5B7387;
    --brand:#2E7BC4; --teal:#2BB6A3; --warn:#C4622E; --bad:#C43E3E; --good:#1E9E6A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,-apple-system,Arial,sans-serif;font-size:15px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--brand))}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .who{margin-inline-start:auto;color:var(--dim);font-size:13px}
  main{max-width:1180px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .n{font-size:27px;font-weight:800;line-height:1.15}
  .kpi .l{color:var(--dim);font-size:12px;margin-top:4px}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;font-size:12px;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid #F0F4F7}
  tr.row:hover{background:#F8FBFD;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
  .s-active{background:#E4F6EE;color:var(--good)} .s-trial{background:#E8F1FA;color:var(--brand)}
  .s-suspended{background:#FBECE4;color:var(--warn)} .s-pending{background:#F0F2F4;color:var(--dim)}
  .s-closed{background:#FAE7E7;color:var(--bad)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:inherit}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  button{padding:10px 18px;border:0;border-radius:9px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .bar input[type=search]{max-width:260px}
  .err{background:#FAE7E7;color:var(--bad);padding:10px 13px;border-radius:9px;margin-bottom:12px;font-size:14px}
  .ok{background:#E4F6EE;color:var(--good);padding:10px 13px;border-radius:9px;margin-bottom:12px;font-size:14px}
  .modal{position:fixed;inset:0;background:#0E223355;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal .card{max-width:640px;width:100%}
  h2{font-size:17px;margin:0 0 16px}
  h3{font-size:13px;color:var(--dim);margin:20px 0 10px;font-weight:600}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:5px}
  .login{max-width:360px;margin:14vh auto}
  @media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = (localStorage.gf_api || '') + '/api/platform';
let token = localStorage.gf_token || '';
let me = null;

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ('שגיאה ' + r.status));
  return body;
}

const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const app = () => document.getElementById('app');
const money = (n) => '₪' + Number(n || 0).toLocaleString('he-IL');
const date = (d) => d ? new Date(d).toLocaleDateString('he-IL') : '—';
const STATUS = { active:'פעיל', trial:'ניסיון', suspended:'מושהה', pending:'בהקמה', closed:'סגור' };

// ------------------------------------------------------------------ login
function renderLogin(err) {
  app().innerHTML = '';
  const box = el(`
    <div class="login">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2BB6A3,#2E7BC4)"></div>
        <div><div style="font-weight:800;font-size:18px">GanFlow</div><div style="color:#5B7387;font-size:12px">קונסולת לקוחות</div></div>
      </div>
      <div class="card">
        ${err ? `<div class="err">${err}</div>` : ''}
        <label>אימייל</label><input id="e" type="email" autocomplete="username">
        <div style="height:12px"></div>
        <label>סיסמה</label><input id="p" type="password" autocomplete="current-password">
        <div style="height:16px"></div>
        <button id="go" style="width:100%">כניסה</button>
      </div>
    </div>`);
  app().appendChild(box);

  const submit = async () => {
    const btn = box.querySelector('#go'); btn.disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: JSON.stringify({
        email: box.querySelector('#e').value, password: box.querySelector('#p').value }) });
      token = r.token; me = r.user; localStorage.gf_token = token;
      renderApp();
    } catch (e) { renderLogin(e.message); }
  };
  box.querySelector('#go').onclick = submit;
  box.querySelector('#p').onkeydown = (ev) => { if (ev.key === 'Enter') submit(); };
}

// ------------------------------------------------------------------- shell
async function renderApp() {
  app().innerHTML = `
    <header>
      <div class="logo"></div>
      <h1>GanFlow — קונסולת לקוחות</h1>
      <div class="who">${me ? me.full_name || me.email : ''} · <a href="#" id="out" style="color:#5B7387">יציאה</a></div>
    </header>
    <main>
      <div id="kpis" class="kpis"></div>
      <div class="card">
        <div class="bar">
          <h2 style="margin:0;flex:1">לקוחות</h2>
          <input type="search" id="q" placeholder="חיפוש">
          <select id="st" style="width:auto">
            <option value="">כל הסטטוסים</option>
            ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
          </select>
          <button id="new">+ לקוח חדש</button>
        </div>
        <div id="list">טוען…</div>
      </div>
    </main>`;
  document.getElementById('out').onclick = () => { localStorage.removeItem('gf_token'); token=''; renderLogin(); };
  document.getElementById('new').onclick = renderCreate;
  document.getElementById('q').oninput = debounce(loadList, 250);
  document.getElementById('st').onchange = loadList;
  loadSummary(); loadList();
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function loadSummary() {
  try {
    const s = await api('/summary');
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="n">${s.tenants}</div><div class="l">לקוחות פעילים</div></div>
      <div class="kpi"><div class="n">${s.children.toLocaleString('he-IL')}</div><div class="l">ילדים במערכת</div></div>
      <div class="kpi"><div class="n">${money(s.monthly_revenue)}</div><div class="l">הכנסה חודשית</div></div>
      <div class="kpi"><div class="n">${money(s.monthly_revenue*12)}</div><div class="l">קצב שנתי</div></div>
      <div class="kpi"><div class="n">${s.suspended}</div><div class="l">מושהים</div></div>
      ${s.unreachable.length ? `<div class="kpi"><div class="n" style="color:var(--bad)">${s.unreachable.length}</div><div class="l">מסדים לא נגישים</div></div>` : ''}`;
  } catch (e) { document.getElementById('kpis').innerHTML = `<div class="err">${e.message}</div>`; }
}

async function loadList() {
  const q = document.getElementById('q').value, st = document.getElementById('st').value;
  const box = document.getElementById('list');
  try {
    const rows = await api(`/tenants?search=${encodeURIComponent(q)}&status=${st}`);
    if (!rows.length) { box.innerHTML = '<div style="color:#5B7387;padding:20px 0">אין לקוחות עדיין.</div>'; return; }
    box.innerHTML = `<table><thead><tr>
        <th>שם</th><th>כתובת</th><th>סטטוס</th><th>מחיר לילד</th><th>מינימום</th><th>נוצר</th></tr></thead>
      <tbody>${rows.map(t => `<tr class="row" data-id="${t._id}">
        <td><b>${esc(t.name)}</b></td>
        <td class="mono">${esc(t.slug)}.ganflow.co.il</td>
        <td><span class="pill s-${t.status}">${STATUS[t.status]||t.status}</span></td>
        <td>${t.pricing?.tiers?.length ? 'מדרגות' : money(t.pricing?.price_per_child)}</td>
        <td>${money(t.pricing?.minimum_monthly)}</td>
        <td>${date(t.created_at)}</td></tr>`).join('')}</tbody></table>`;
    box.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => renderTenant(tr.dataset.id));
  } catch (e) { box.innerHTML = `<div class="err">${e.message}</div>`; }
}

const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// ------------------------------------------------------------------ create
function renderCreate() {
  const m = el(`<div class="modal"><div class="card">
    <h2>לקוח חדש</h2>
    <div id="err"></div>
    <div class="grid">
      <div><label>שם הגן / הרשת</label><input id="name"></div>
      <div><label>כתובת (באנגלית)</label><input id="slug" class="mono" placeholder="shalhevet">
        <div class="hint">shalhevet.ganflow.co.il — לא ניתן לשינוי אחר כך</div></div>
    </div>
    <h3>המנהל הראשון</h3>
    <div class="grid">
      <div><label>אימייל</label><input id="ae" type="email"></div>
      <div><label>שם מלא</label><input id="an"></div>
      <!-- The identity the gan's own system logs in with: name AND id number
           together are the credentials, and the email is not part of it. The
           form asked for the email and not this, so the administrator it
           created could never sign in to what had just been built. -->
      <div><label>תעודת זהות</label><input id="aid" inputmode="numeric" autocomplete="off">
        <div class="hint">איתה נכנסים למערכת, יחד עם השם המלא</div></div>
    </div>
    <h3>מבנה</h3>
    <div class="grid">
      <div><label>סוג</label><select id="net"><option value="">גן בודד</option><option value="1">רשת עם סניפים</option></select></div>
      <div><label>שם הסניף הראשון</label><input id="fb"></div>
    </div>
    <h3>תמחור</h3>
    <div class="grid3">
      <div><label>מחיר לילד</label><input id="ppc" type="number" value="50"></div>
      <div><label>מינימום חודשי</label><input id="min" type="number" value="400"></div>
      <div><label>חינם עד</label><input id="free" type="date"></div>
    </div>
    <h3>איש קשר</h3>
    <div class="grid3">
      <div><label>שם</label><input id="cn"></div>
      <div><label>טלפון</label><input id="cp"></div>
      <div><label>אימייל</label><input id="ce"></div>
    </div>
    <div style="height:20px"></div>
    <div style="display:flex;gap:10px"><button id="save">צור לקוח</button><button class="ghost" id="cancel">ביטול</button></div>
  </div></div>`);
  document.body.appendChild(m);
  m.querySelector('#cancel').onclick = () => m.remove();
  m.querySelector('#name').oninput = (e) => {
    const s = m.querySelector('#slug');
    if (!s.dataset.touched) s.value = translit(e.target.value);
  };
  m.querySelector('#slug').oninput = (e) => { e.target.dataset.touched = '1'; };

  m.querySelector('#save').onclick = async () => {
    const b = m.querySelector('#save'); b.disabled = true;
    const free = m.querySelector('#free').value;
    try {
      const r = await api('/tenants', { method: 'POST', body: JSON.stringify({
        name: m.querySelector('#name').value.trim(),
        slug: m.querySelector('#slug').value.trim(),
        admin_email: m.querySelector('#ae').value.trim(),
        admin_name: m.querySelector('#an').value.trim(),
        admin_id_number: m.querySelector('#aid').value.trim(),
        is_network: !!m.querySelector('#net').value,
        first_branch_name: m.querySelector('#fb').value.trim(),
        pricing: {
          price_per_child: Number(m.querySelector('#ppc').value),
          minimum_monthly: Number(m.querySelector('#min').value),
          free_until: free || null,
        },
        contact: { name: m.querySelector('#cn').value, phone: m.querySelector('#cp').value, email: m.querySelector('#ce').value },
      })});
      m.remove();
      showPassword(r.tenant, r.temp_password, r.login);
      loadList(); loadSummary();
    } catch (e) { m.querySelector('#err').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; }
  };
}

/**
 * Shown once and never again — the password is not stored anywhere readable.
 *
 * All THREE details, not just the password. The gan's system logs in on full
 * name plus id number and then the password, so handing over the password
 * alone hands over a third of what is needed — and the id number is the part
 * whoever created the customer typed and has already forgotten.
 */
function showPassword(tenant, pw, login) {
  const rows = [
    ['שם מלא', (login && login.full_name) || ''],
    ['תעודת זהות', (login && login.id_number) || ''],
    ['סיסמה', pw],
  ].filter(([, v]) => v).map(([k, v]) => `
    <div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)">
      <span class="hint" style="align-self:center">${esc(k)}</span>
      <b class="mono" style="font-size:17px;letter-spacing:.03em">${esc(v)}</b>
    </div>`).join('');
  const m = el(`<div class="modal"><div class="card">
    <h2>${esc(tenant.name)} הוקם</h2>
    <div class="ok">המערכת מוכנה בכתובת <b class="mono">${esc(tenant.slug)}.ganflow.co.il</b></div>
    <p style="margin:0 0 8px">פרטי הכניסה של המנהל/ת — <b>מוצגים פעם אחת בלבד</b>. העתק אותם עכשיו ומסור אותם בטלפון, לא במייל.</p>
    <div style="background:#F4F7FA;border:1px solid var(--line);border-radius:9px;padding:6px 14px">${rows}</div>
    <p class="hint">כדאי שהמנהל/ת יחליף/תחליף את הסיסמה אחרי הכניסה הראשונה.</p>
    <div style="height:14px"></div><button id="ok">סגור</button>
  </div></div>`);
  document.body.appendChild(m);
  m.querySelector('#ok').onclick = () => m.remove();
}

/** Hebrew is not a subdomain. A first guess the user can overwrite. */
function translit(s) {
  const map = {'א':'a','ב':'b','ג':'g','ד':'d','ה':'h','ו':'v','ז':'z','ח':'ch','ט':'t','י':'y','כ':'k','ך':'k','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'a','פ':'p','ף':'f','צ':'ts','ץ':'ts','ק':'k','ר':'r','ש':'sh','ת':'t',' ':'-','"':'','\'':''};
  return String(s).split('').map(c => map[c] ?? c).join('').toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,32);
}

// ------------------------------------------------------------------ detail
async function renderTenant(id) {
  const m = el('<div class="modal"><div class="card">טוען…</div></div>');
  document.body.appendChild(m);
  try {
    const { tenant: t, usage: u } = await api('/tenants/' + id);
    m.querySelector('.card').innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <h2 style="margin:0;flex:1">${esc(t.name)}</h2>
        <span class="pill s-${t.status}">${STATUS[t.status]||t.status}</span>
      </div>
      <div class="mono" style="color:#5B7387;margin-bottom:18px">${esc(t.slug)}.ganflow.co.il · ${esc(t.db_name)}</div>
      ${u?.error ? `<div class="err">${esc(u.error)}</div>` : `
      <div class="kpis">
        <div class="kpi"><div class="n">${u.children}</div><div class="l">ילדים</div></div>
        <div class="kpi"><div class="n">${u.branches}</div><div class="l">סניפים</div></div>
        <div class="kpi"><div class="n">${u.employees}</div><div class="l">עובדים</div></div>
        <div class="kpi"><div class="n">${money(u.monthly_charge)}</div><div class="l">חיוב חודשי</div></div>
      </div>`}
      <h3>תמחור</h3>
      <div class="grid3">
        <div><label>מחיר לילד</label><input id="ppc" type="number" value="${t.pricing?.price_per_child ?? ''}"></div>
        <div><label>מינימום חודשי</label><input id="min" type="number" value="${t.pricing?.minimum_monthly ?? ''}"></div>
        <div><label>חינם עד</label><input id="free" type="date" value="${t.pricing?.free_until ? new Date(t.pricing.free_until).toISOString().slice(0,10) : ''}"></div>
      </div>
      <div style="margin-top:12px"><label>מדרגות לרשתות — JSON, ריק = מחיר אחיד</label>
        <input id="tiers" class="mono" value='${esc(JSON.stringify(t.pricing?.tiers || []))}'>
        <div class="hint">[{"up_to":500,"price":50},{"up_to":null,"price":12}]</div></div>
      <h3>איש קשר</h3>
      <div class="grid3">
        <div><label>שם</label><input id="cn" value="${esc(t.contact?.name)}"></div>
        <div><label>טלפון</label><input id="cp" value="${esc(t.contact?.phone)}"></div>
        <div><label>אימייל</label><input id="ce" value="${esc(t.contact?.email)}"></div>
      </div>
      <h3>הערות</h3><textarea id="notes" rows="3">${esc(t.notes)}</textarea>
      ${t.status === 'suspended' && t.purge_after ? `<div class="err" style="margin-top:14px">מושהה מ-${date(t.suspended_at)}. המידע יימחק ב-${date(t.purge_after)}.</div>` : ''}
      <div id="err"></div>
      <div style="height:18px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="save">שמור</button>
        ${t.status === 'suspended'
          ? '<button class="ghost" id="resume">החזר לפעילות</button>'
          : '<button class="danger" id="susp">השהה מנוי</button>'}
        <button class="ghost" id="close" style="margin-inline-start:auto">סגור</button>
      </div>`;

    m.querySelector('#close').onclick = () => m.remove();

    m.querySelector('#save').onclick = async () => {
      try {
        let tiers = [];
        try { tiers = JSON.parse(m.querySelector('#tiers').value || '[]'); }
        catch { throw new Error('מדרגות — JSON לא תקין'); }
        await api('/tenants/' + id, { method: 'PATCH', body: JSON.stringify({
          pricing: {
            price_per_child: Number(m.querySelector('#ppc').value),
            minimum_monthly: Number(m.querySelector('#min').value),
            free_until: m.querySelector('#free').value || null,
            tiers,
          },
          contact: { name: m.querySelector('#cn').value, phone: m.querySelector('#cp').value, email: m.querySelector('#ce').value },
          notes: m.querySelector('#notes').value,
        })});
        m.remove(); loadList(); loadSummary();
      } catch (e) { m.querySelector('#err').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };

    const susp = m.querySelector('#susp');
    if (susp) susp.onclick = async () => {
      const reason = prompt(`השהיית "${t.name}".\n\nהגן יאבד גישה מיד. המידע יישמר חצי שנה ואז יימחק.\n\nסיבה:`);
      if (reason === null) return;
      await api(`/tenants/${id}/suspend`, { method: 'POST', body: JSON.stringify({ reason }) });
      m.remove(); loadList(); loadSummary();
    };
    const res = m.querySelector('#resume');
    if (res) res.onclick = async () => {
      await api(`/tenants/${id}/resume`, { method: 'POST' });
      m.remove(); loadList(); loadSummary();
    };
  } catch (e) {
    m.querySelector('.card').innerHTML = `<div class="err">${esc(e.message)}</div><button class="ghost" onclick="this.closest('.modal').remove()">סגור</button>`;
  }
}

// ------------------------------------------------------------------- start
(async () => {
  if (!token) return renderLogin();
  try { const s = await api('/summary'); me = null; renderApp(); }
  catch { localStorage.removeItem('gf_token'); token = ''; renderLogin(); }
})();
</script>
</body>
</html>
