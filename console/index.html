<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חלום — קונסולת לקוחות</title>
<style>
  :root{
    --bg:#F4F7FA; --card:#fff; --line:#E2EAF0; --ink:#16324A; --dim:#5B7387;
    --brand:#2E7BC4; --teal:#2BB6A3; --warn:#C4622E; --bad:#C43E3E; --good:#1E9E6A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,-apple-system,Arial,sans-serif;font-size:15px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--brand))}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .who{margin-inline-start:auto;color:var(--dim);font-size:13px}
  main{max-width:1180px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .n{font-size:27px;font-weight:800;line-height:1.15}
  .kpi .l{color:var(--dim);font-size:12px;margin-top:4px}
  table{width:100%;border-collapse:collapse}
  th{text-align:right;font-size:12px;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid #F0F4F7}
  tr.row:hover{background:#F8FBFD;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
  .s-active{background:#E4F6EE;color:var(--good)} .s-trial{background:#E8F1FA;color:var(--brand)}
  .s-suspended{background:#FBECE4;color:var(--warn)} .s-pending{background:#F0F2F4;color:var(--dim)}
  .s-closed{background:#FAE7E7;color:var(--bad)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:inherit}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  button{padding:10px 18px;border:0;border-radius:9px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .bar input[type=search]{max-width:260px}
  .err{background:#FAE7E7;color:var(--bad);padding:10px 13px;border-radius:9px;margin-bottom:12px;font-size:14px}
  .ok{background:#E4F6EE;color:var(--good);padding:10px 13px;border-radius:9px;margin-bottom:12px;font-size:14px}
  .modal{position:fixed;inset:0;background:#0E223355;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal .card{max-width:640px;width:100%}
  h2{font-size:17px;margin:0 0 16px}
  h3{font-size:13px;color:var(--dim);margin:20px 0 10px;font-weight:600}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:5px}
  .login{max-width:360px;margin:14vh auto}
  @media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/**
 * The product's name and the domain customers are addressed at.
 *
 * Both were written out in eight places, so changing either meant finding all
 * eight — and the one that gets missed is the one printed on a contract. The
 * domain also has to match what the server resolves customers by, which is why
 * it comes from the server rather than being repeated here: two copies of an
 * address disagree the day somebody edits one.
 */
const BRAND = 'חלום';
const BRAND_TAG = 'מערכת לניהול גני ילדים';
let DOMAIN = 'dreamgan.com';   // replaced at load from /api/platform/brand

const API = (localStorage.gf_api || '') + '/api/platform';
let token = localStorage.gf_token || '';
let me = null;

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ('שגיאה ' + r.status));
  return body;
}

const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

// Asked for before the first screen paints, so the login does not flash a
// placeholder domain and then correct itself. If it fails the built-in default
// stands — a console that will not open because a brand name did not load is a
// worse outcome than a stale name.
async function loadBrand() {
  try {
    const r = await fetch(API + '/brand');
    if (!r.ok) return;
    const b = await r.json();
    if (b.domain) DOMAIN = b.domain;
  } catch { /* the default is good enough to work with */ }
}
const app = () => document.getElementById('app');
const money = (n) => '₪' + Number(n || 0).toLocaleString('he-IL');
const date = (d) => d ? new Date(d).toLocaleDateString('he-IL') : '—';
const STATUS = { active:'פעיל', trial:'ניסיון', suspended:'מושהה', pending:'בהקמה', closed:'סגור' };

// ------------------------------------------------------------------ login
function renderLogin(err) {
  app().innerHTML = '';
  const box = el(`
    <div class="login">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2BB6A3,#2E7BC4)"></div>
        <div><div style="font-weight:800;font-size:18px">${BRAND}</div><div style="color:#5B7387;font-size:12px">קונסולת לקוחות</div></div>
      </div>
      <div class="card">
        ${err ? `<div class="err">${err}</div>` : ''}
        <label>אימייל</label><input id="e" type="email" autocomplete="username">
        <div style="height:12px"></div>
        <label>סיסמה</label><input id="p" type="password" autocomplete="current-password">
        <div style="height:16px"></div>
        <button id="go" style="width:100%">כניסה</button>
      </div>
    </div>`);
  app().appendChild(box);

  const submit = async () => {
    const btn = box.querySelector('#go'); btn.disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: JSON.stringify({
        email: box.querySelector('#e').value, password: box.querySelector('#p').value }) });
      token = r.token; me = r.user; localStorage.gf_token = token;
      renderApp();
    } catch (e) { renderLogin(e.message); }
  };
  box.querySelector('#go').onclick = submit;
  box.querySelector('#p').onkeydown = (ev) => { if (ev.key === 'Enter') submit(); };
}

// ------------------------------------------------------------------- shell
async function renderApp() {
  app().innerHTML = `
    <header>
      <div class="logo"></div>
      <h1>${BRAND} — קונסולת לקוחות</h1>
      <div class="who">${me ? me.full_name || me.email : ''} · <a href="#" id="out" style="color:#5B7387">יציאה</a></div>
    </header>
    <main>
      <div id="kpis" class="kpis"></div>
      <div class="card">
        <div class="bar">
          <h2 style="margin:0;flex:1">לקוחות</h2>
          <input type="search" id="q" placeholder="חיפוש">
          <select id="st" style="width:auto">
            <option value="">כל הסטטוסים</option>
            ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
          </select>
          <button id="new">+ לקוח חדש</button>
        </div>
        <div id="list">טוען…</div>
      </div>

      <!-- What each customer owes for a month, frozen on the day it was worked
           out. The console read the charge live everywhere else, which is right
           for a screen and wrong for an invoice: March's bill must not change in
           May because two children joined. -->
      <div class="card" style="margin-top:18px">
        <div class="bar">
          <h2 style="margin:0;flex:1">חיוב חודשי</h2>
          <input id="bmonth" type="month" style="width:auto">
          <button class="ghost" id="bload">הצג</button>
          <button id="brun">חשב חודש</button>
        </div>
        <div id="billing" class="hint">בחרו חודש והציגו.</div>
      </div>

      <!-- Who filled in the form on the marketing page. Above the audit log
           deliberately: one of these is a person who paid a deposit and is
           waiting for the phone to ring, and the log is never that. -->
      <div class="card" style="margin-top:18px">
        <div class="bar">
          <h2 style="margin:0;flex:1">נרשמים מהאתר <span id="sgcount" class="hint" style="font-weight:400"></span></h2>
          <button class="ghost" id="sgReload">רענן</button>
        </div>
        <div id="signups">טוען…</div>
      </div>

      <!-- The log was being written and never read. Every action already lands
           in it — who created a customer, who suspended one, who opened
           somebody's system for support — and a record nobody can look at
           answers no question. It is also the only honest reply to "who
           switched us off on the 3rd". -->
      <div class="card" style="margin-top:18px">
        <div class="bar">
          <h2 style="margin:0;flex:1">יומן פעולות</h2>
          <button class="ghost" id="auditToggle">הצג</button>
        </div>
        <div id="audit" style="display:none">טוען…</div>
      </div>
    </main>`;
  document.getElementById('out').onclick = () => { localStorage.removeItem('gf_token'); token=''; renderLogin(); };
  document.getElementById('new').onclick = renderCreate;
  document.getElementById('q').oninput = debounce(loadList, 250);
  document.getElementById('st').onchange = loadList;
  // Collapsed by default and fetched only when opened — the log is for the
  // moment somebody asks a question about it, not something to load on every
  // visit to the customer list.
  const bm = document.getElementById('bmonth');
  bm.value = new Date().toISOString().slice(0, 7);
  document.getElementById('bload').onclick = () => loadBilling(bm.value);
  document.getElementById('brun').onclick = () => runBilling(bm.value);

  document.getElementById('sgReload').onclick = loadSignups;
  loadSignups();

  document.getElementById('auditToggle').onclick = () => {
    const box = document.getElementById('audit');
    const open = box.style.display === 'none';
    box.style.display = open ? 'block' : 'none';
    document.getElementById('auditToggle').textContent = open ? 'הסתר' : 'הצג';
    if (open) loadAudit();
  };
  loadSummary(); loadList();
}

const BILL_STATUS = { draft: 'טיוטה', issued: 'נמסר', paid: 'שולם', void: 'בוטל' };

async function loadBilling(month) {
  const box = document.getElementById('billing');
  box.textContent = 'טוען…';
  try {
    const { rows, total } = await api('/billing?month=' + encodeURIComponent(month));
    if (!rows.length) {
      box.innerHTML = `<div class="hint">לא חושב חודש ${esc(month)}. "חשב חודש" יבנה אותו.</div>`;
      return;
    }
    box.innerHTML = `
      <div class="ok">סה״כ ${money(total)} · ${rows.length} לקוחות</div>
      <table><thead><tr>
        <th>לקוח</th><th>ילדים</th><th>לילד</th><th>סכום</th><th>איך יצא</th><th>סטטוס</th><th></th>
      </tr></thead><tbody>${rows.map(r => `
        <tr>
          <td><b>${esc(r.tenant_name || r.tenant_slug)}</b></td>
          <td>${r.children}</td>
          <td>${money(r.rate)}</td>
          <td><b>${money(r.amount)}</b></td>
          <td class="hint">${esc(r.breakdown || '')}</td>
          <td>${esc(BILL_STATUS[r.status] || r.status)}</td>
          <td>${r.status === 'draft'
            ? `<button class="ghost" data-mark="${r._id}" data-to="issued">סמן כנמסר</button>`
            : r.status === 'issued'
              ? `<button class="ghost" data-mark="${r._id}" data-to="paid">סמן כשולם</button>`
              : ''}</td>
        </tr>`).join('')}</tbody></table>`;
    box.querySelectorAll('[data-mark]').forEach((b) => {
      b.onclick = async () => {
        try {
          await api('/billing/' + b.dataset.mark, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.to }) });
          loadBilling(month); loadAudit();
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function runBilling(month) {
  // Shown before it is written, because "recompute" on a month somebody has
  // already been given a number for is a conversation and not a button.
  const dry = await api('/billing/run', { method: 'POST', body: JSON.stringify({ month, dry_run: true }) })
    .catch((e) => { alert(e.message); return null; });
  if (!dry) return;
  const skipped = dry.rows.filter((r) => r.skipped).length;
  if (!confirm(
    `חישוב חודש ${month}:\n\n` +
    `${dry.rows.length} לקוחות · סה״כ ₪${dry.total.toLocaleString('he-IL')}\n` +
    (skipped ? `${skipped} חודשים כבר חושבו ולא ייגעו.\n` : '') +
    (dry.failed.length ? `⚠️ ${dry.failed.length} לקוחות לא נגישים ולא יחויבו.\n` : '') +
    '\nלכתוב?',
  )) return;
  try {
    await api('/billing/run', { method: 'POST', body: JSON.stringify({ month }) });
    loadBilling(month); loadAudit();
  } catch (e) { alert(e.message); }
}

/** What each action is called on screen. An unknown one shows its own key
 *  rather than a blank — a new action added later must not read as nothing. */
const ACTIONS = {
  'tenant.create': 'הקמת לקוח',
  'tenant.update': 'עדכון לקוח',
  'tenant.suspend': 'השהיית לקוח',
  'tenant.resume': 'החזרה לפעילות',
  'tenant.impersonate': 'כניסה למערכת של לקוח',
  'billing.run': 'חישוב חודש חיוב',
  'billing.issued': 'חיוב נמסר ללקוח',
  'billing.paid': 'חיוב שולם',
  'billing.void': 'חיוב בוטל',
};

/* The pipeline a signup walks: somebody filled the form, somebody called them,
 * they paid or they did not. Four words, because a longer pipeline is one
 * nobody keeps up to date. */
const SIGNUP_STATUS = { new: 'חדש', contacted: 'דיברנו', paid: 'שילם', declined: 'לא רלוונטי' };

async function loadSignups() {
  const box = document.getElementById('signups');
  const count = document.getElementById('sgcount');
  try {
    const rows = await api('/signups');
    const open = rows.filter(r => r.status === 'new').length;
    count.textContent = rows.length ? `· ${open} ממתינים לשיחה מתוך ${rows.length}` : '';
    if (!rows.length) {
      box.innerHTML = '<div class="hint" style="padding:8px 0">עוד לא נרשם אף אחד מהאתר.</div>';
      return;
    }
    box.innerHTML = `<table><thead><tr>
        <th>מתי</th><th>הגן</th><th>איש קשר</th><th>טלפון</th><th>אימייל</th><th>ילדים</th><th>סניפים</th><th>סטטוס</th>
      </tr></thead><tbody>${rows.map(r => `
        <tr${r.status === 'new' ? ' style="background:#F7FBFE"' : ''}>
          <td class="mono">${esc(new Date(r.created_at).toLocaleDateString('he-IL'))}</td>
          <td><b>${esc(r.gan_name)}</b>${r.note ? `<div class="hint" style="font-size:12px">${esc(r.note)}</div>` : ''}</td>
          <td>${esc(r.full_name)}</td>
          <td class="mono"><a href="tel:${esc(r.phone)}" style="color:#2E7BC4">${esc(r.phone)}</a></td>
          <td class="mono"><a href="mailto:${esc(r.email)}" style="color:#2E7BC4">${esc(r.email)}</a></td>
          <td>${r.children ?? '—'}</td>
          <td>${esc(r.branches || '—')}</td>
          <td><select data-sg="${r._id}" style="width:auto;font-size:13px">
            ${Object.entries(SIGNUP_STATUS).map(([k, v]) =>
              `<option value="${k}"${r.status === k ? ' selected' : ''}>${v}</option>`).join('')}
          </select></td>
        </tr>
        ${r.notify_error ? `<tr><td colspan="8" class="err" style="font-size:13px">
          ההתראה במייל על הפנייה הזו לא נשלחה (${esc(r.notify_error)}) — הפנייה עצמה נשמרה, אבל אף אחד לא קיבל הודעה עליה.
        </td></tr>` : ''}`).join('')}</tbody></table>`;

    box.querySelectorAll('select[data-sg]').forEach(sel => {
      sel.onchange = async () => {
        const prev = sel.dataset.prev || '';
        try {
          await api('/signups/' + sel.dataset.sg, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
          loadSignups();
        } catch (e) { alert(e.message); if (prev) sel.value = prev; }
      };
      sel.dataset.prev = sel.value;
    });
  } catch (e) {
    box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function loadAudit() {
  const box = document.getElementById('audit');
  try {
    const rows = await api('/audit');
    if (!rows.length) { box.innerHTML = '<div class="hint" style="padding:8px 0">אין עדיין פעולות רשומות.</div>'; return; }
    box.innerHTML = `<table><thead><tr>
        <th>מתי</th><th>מי</th><th>מה</th><th>לקוח</th><th>פרטים</th>
      </tr></thead><tbody>${rows.map(r => `
        <tr>
          <td class="mono">${esc(new Date(r.at).toLocaleString('he-IL'))}</td>
          <td>${esc(r.actor_email || '—')}</td>
          <td>${esc(ACTIONS[r.action] || r.action)}</td>
          <td>${esc(r.tenant_slug || '—')}</td>
          <td class="hint">${esc(r.detail && typeof r.detail === 'object'
            ? (r.detail.reason || Object.keys(r.detail).join(', '))
            : (r.detail || ''))}</td>
        </tr>`).join('')}</tbody></table>`;
  } catch (e) {
    box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function loadSummary() {
  try {
    const s = await api('/summary');
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="n">${s.tenants}</div><div class="l">לקוחות פעילים</div></div>
      <div class="kpi"><div class="n">${s.children.toLocaleString('he-IL')}</div><div class="l">ילדים במערכת</div></div>
      <div class="kpi"><div class="n">${money(s.monthly_revenue)}</div><div class="l">הכנסה חודשית</div></div>
      <div class="kpi"><div class="n">${money(s.monthly_revenue*12)}</div><div class="l">קצב שנתי</div></div>
      <div class="kpi"><div class="n">${s.suspended}</div><div class="l">מושהים</div></div>
      ${s.unreachable.length ? `<div class="kpi"><div class="n" style="color:var(--bad)">${s.unreachable.length}</div><div class="l">מסדים לא נגישים</div></div>` : ''}`;
  } catch (e) { document.getElementById('kpis').innerHTML = `<div class="err">${e.message}</div>`; }
}

async function loadList() {
  const q = document.getElementById('q').value, st = document.getElementById('st').value;
  const box = document.getElementById('list');
  try {
    const rows = await api(`/tenants?search=${encodeURIComponent(q)}&status=${st}`);
    if (!rows.length) { box.innerHTML = '<div style="color:#5B7387;padding:20px 0">אין לקוחות עדיין.</div>'; return; }
    box.innerHTML = `<table><thead><tr>
        <th>שם</th><th>כתובת</th><th>סטטוס</th><th>מחיר לילד</th><th>מינימום</th><th>נוצר</th></tr></thead>
      <tbody>${rows.map(t => `<tr class="row" data-id="${t._id}">
        <td><b>${esc(t.name)}</b></td>
        <td class="mono">${esc(t.slug)}.${DOMAIN}</td>
        <td><span class="pill s-${t.status}">${STATUS[t.status]||t.status}</span></td>
        <td>${t.pricing?.tiers?.length ? 'מדרגות' : money(t.pricing?.price_per_child)}</td>
        <td>${money(t.pricing?.minimum_monthly)}</td>
        <td>${date(t.created_at)}</td></tr>`).join('')}</tbody></table>`;
    box.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => renderTenant(tr.dataset.id));
  } catch (e) { box.innerHTML = `<div class="err">${e.message}</div>`; }
}

const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));


/**
 * Money, in one place, because the create form and the customer's own screen
 * have to mean the same thing by it.
 *
 * WHAT WAS WRONG WITH THE OLD ONE. Three numbers and a bare date field. The
 * date decided whether a customer is billed at all and said nothing about it —
 * empty read as "free forever" to some eyes and "paying" to others — and "45
 * days free", which is the sentence actually said on the telephone, meant
 * counting on a calendar and being one day out. The size bands the pricing
 * already supported could only be entered as hand-written JSON, so in practice
 * they could not be entered.
 *
 * Now the choice is made rather than implied, the day count is a button, and
 * the sentence underneath says what the customer will actually pay — which is
 * the only part anybody checks.
 */
function pricingFields(p = {}, opts = {}) {
  const free = p.free_until ? new Date(p.free_until).toISOString().slice(0, 10) : '';
  const tiered = Boolean(p.tiers && p.tiers.length);
  return `
    <h3>תמחור</h3>
    <div class="grid">

/**
 * Wire it up, and hand back a read() that produces the pricing object.
 * Returns { read, trialEnd } — trialEnd is what the customer's status is set
 * from, and it is the same date the free period ends. One promise, two fields.
 */
function pricingWire(root, p = {}) {
  const $ = (id) => root.querySelector('#' + id);
  const rows = (p.tiers && p.tiers.length ? p.tiers : [{ up_to: 500, price: 50 }, { up_to: null, price: 25 }]).slice();

  function drawTiers() {
    $('ptiers').innerHTML = rows.map((t, i) => `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span style="color:#5B7387;font-size:13px;min-width:34px">${i === rows.length - 1 ? 'מעל' : 'עד'}</span>
        <input type="number" min="1" data-up="${i}" value="${t.up_to ?? ''}"
               placeholder="${i === rows.length - 1 ? 'כל השאר' : 'ילדים'}"
               style="max-width:120px" ${i === rows.length - 1 ? 'disabled' : ''}>
        <span style="color:#5B7387;font-size:13px">ילדים —</span>
        <input type="number" min="0" data-price="${i}" value="${t.price ?? ''}" style="max-width:110px">
        <span style="color:#5B7387;font-size:13px">₪ לילד</span>
        ${rows.length > 2 && i < rows.length - 1 ? `<a href="#" data-del="${i}" style="color:#C43E3E;font-size:13px">הסר</a>` : ''}
      </div>`).join('') + '<a href="#" id="paddtier" style="font-size:13px">+ מדרגה</a>';

    $('ptiers').querySelectorAll('[data-up]').forEach((el) => {
      el.oninput = () => { rows[+el.dataset.up].up_to = el.value === '' ? null : Number(el.value); summarise(); };
    });
    $('ptiers').querySelectorAll('[data-price]').forEach((el) => {
      el.oninput = () => { rows[+el.dataset.price].price = Number(el.value); summarise(); };
    });
    $('ptiers').querySelectorAll('[data-del]').forEach((el) => {
      el.onclick = (e) => { e.preventDefault(); rows.splice(+el.dataset.del, 1); drawTiers(); summarise(); };
    });
    $('paddtier').onclick = (e) => {
      e.preventDefault();
      rows.splice(rows.length - 1, 0, { up_to: null, price: 0 });
      drawTiers(); summarise();
    };
  }

  function priceSentence() {
    if ($('ptiered').checked) {
      return rows.map((t, i) => i === rows.length - 1
        ? `מעל — ₪${t.price || 0} לילד`
        : `עד ${t.up_to || '?'} ילדים ₪${t.price || 0}`).join(', ');
    }
    return `₪${Number($('ppc').value || 0)} לילד`;
  }

  function summarise() {
    const min = Number($('pmin').value || 0);
    const minPart = min ? `, מינימום ₪${min} בחודש` : '';
    if ($('pstart').value === 'free' && $('pfree').value) {
      const d = new Date($('pfree').value);
      const days = Math.round((d - new Date()) / 86400000);
      $('psum').innerHTML = `חינם עד <b>${d.toLocaleDateString('he-IL')}</b> (${days} ימים מהיום), ואז ${priceSentence()}${minPart}.`;
    } else if ($('pstart').value === 'free') {
      $('psum').innerHTML = '<span style="color:#C4622E">בחרת "חינם לתקופה" ולא נבחר תאריך — הלקוח יחויב מיד.</span>';
    } else {
      $('psum').innerHTML = `משלם מהחודש הראשון: ${priceSentence()}${minPart}.`;
    }
  }

  $('pstart').onchange = () => {
    $('pfreewrap').style.display = $('pstart').value === 'free' ? '' : 'none';
    summarise();
  };
  $('ptiered').onchange = () => {
    $('ptiers').style.display = $('ptiered').checked ? '' : 'none';
    summarise();
  };
  root.querySelectorAll('[data-days]').forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      const d = new Date();
      d.setDate(d.getDate() + Number(a.dataset.days));
      $('pfree').value = d.toISOString().slice(0, 10);
      summarise();
    };
  });
  ['pfree', 'ppc', 'pmin'].forEach((id) => { $(id).oninput = summarise; });
  drawTiers();
  summarise();

  return {
    read() {
      const freeUntil = $('pstart').value === 'free' ? ($('pfree').value || null) : null;
      return {
        pricing: {
          price_per_child: Number($('ppc').value || 0),
          minimum_monthly: Number($('pmin').value || 0),
          free_until: freeUntil,
          tiers: $('ptiered').checked
            ? rows.map((t, i) => ({ up_to: i === rows.length - 1 ? null : (t.up_to ?? null), price: Number(t.price || 0) }))
            : [],
        },
        // The status follows the money: free for a period IS a trial.
        trial_ends_at: freeUntil,
      };
    },
  };
}

/** Hebrew is not a subdomain. A first guess the user can overwrite. */
function translit(s) {
  const map = {'א':'a','ב':'b','ג':'g','ד':'d','ה':'h','ו':'v','ז':'z','ח':'ch','ט':'t','י':'y','כ':'k','ך':'k','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'a','פ':'p','ף':'f','צ':'ts','ץ':'ts','ק':'k','ר':'r','ש':'sh','ת':'t',' ':'-','"':'','\'':''};
  return String(s).split('').map(c => map[c] ?? c).join('').toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,32);
}

    m.querySelector('#support').onclick = async () => {
      const reason = prompt(
        `צפייה במערכת של "${t.name}".\n\n` +
        'זו צפייה בלבד — אפשר לראות כל מסך ואי אפשר לשנות דבר.\n' +
        'הכניסה נרשמת ביומן עם השם שלך ועם הסיבה, ופגה אחרי 30 דקות.\n\n' +
        'בשביל מה נכנסים?',
      );
      if (!reason) return;
      try {
        const r = await api(`/tenants/${id}/impersonate`, { method: 'POST', body: JSON.stringify({ reason }) });
        // Handed over rather than opened automatically: the token belongs to
        // the customer's address, and this console has no business holding a
        // session for their system in the same browser tab as everybody else's.
        const url = `https://${t.slug}.${DOMAIN}`;
        await navigator.clipboard.writeText(r.token).catch(() => {});
        alert(
          `נוצרה צפייה במערכת של ${r.tenant.name}.\n\n` +
          `נכנסים בתור: ${r.as}\n` +
          `תקף ל-${r.expires_in_minutes} דקות · צפייה בלבד\n` +
          `הכתובת: ${url}\n\n` +
          'האסימון הועתק ללוח.',
        );
        loadAudit();
      } catch (e) { alert(e.message); }
    };

    const price = pricingWire(m, t.pricing || {});

    m.querySelector('#save').onclick = async () => {
      try {
        const money = price.read();
        await api('/tenants/' + id, { method: 'PATCH', body: JSON.stringify({
          pricing: money.pricing,
          trial_ends_at: money.trial_ends_at,
          contact: { name: m.querySelector('#cn').value, phone: m.querySelector('#cp').value, email: m.querySelector('#ce').value },
          notes: m.querySelector('#notes').value,
        })});
        m.remove(); loadList(); loadSummary();
      } catch (e) { m.querySelector('#err').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };

    // ----------------------------------------------------------- the agreement
    // Fetched with the token and opened as a blob rather than linked: a new tab
    // carries no Authorization header, so a plain link would land on the login
    // screen — and this is the one button somebody presses while a customer is
    // sitting in front of them.
    m.querySelector('#agreement').onclick = async () => {
      const b = m.querySelector('#agreement');
      b.disabled = true;
      try {
        const r = await fetch(`${API}/tenants/${id}/agreement`, {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'שגיאה');
        const url = URL.createObjectURL(await r.blob());
        window.open(url, '_blank');
        // Kept alive long enough for the new tab to load it, then released.
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (e) { alert(e.message); }
      b.disabled = false;
    };

    // ------------------------------------------------------- the standing charge
    const subbox = m.querySelector('#subbox');

    async function drawSub() {
      subbox.innerHTML = 'טוען…';
      let s;
      try { s = await api(`/tenants/${id}/subscription`); }
      catch (e) { subbox.innerHTML = `<span style="color:#C43E3E">${esc(e.message)}</span>`; return; }

      const next = s.next_charge;
      // What it is about to charge, in the same words the invoice will carry.
      const nextLine = next
        ? `<div style="margin-bottom:10px">החיוב הבא (${esc(s.month)}): <b>${money(next.amount)}</b>
             <span style="color:var(--dim)">· ${next.children} ילדים · ${esc(next.breakdown)}</span></div>`
        : `<div class="err">${esc(s.error || 'לא ניתן לחשב את החיוב')}</div>`;

      if (!s.connected) {
        subbox.innerHTML = `
          ${nextLine}
          <div style="color:var(--dim);margin-bottom:12px">אין הוראת קבע ב-iCount. הלקוח לא מחויב.</div>
          ${s.icount_configured ? `
          <div class="grid">
            <div><label>אמצעי גבייה</label>
              <select id="hktype">
                <option value="cc">כרטיס אשראי (טוקן מ-iCount)</option>
                <option value="bank">הוראת קבע בנקאית</option>
              </select></div>
            <div id="hkfields"></div>
          </div>
          <div style="margin-top:10px"><button class="ghost" id="hkopen">פתח הוראת קבע</button></div>
          <div class="hint" style="margin-top:8px">
            פרטי הכרטיס נקלטים אצל iCount ולא עוברים דרכנו. כאן מזינים רק את מזהה הטוקן שהם החזירו.
          </div>`
          : `<div class="err">iCount לא מחובר לשרת — חסר ICOUNT_API_TOKEN</div>`}`;

        if (!s.icount_configured) return;

        const fields = () => {
          const cc = subbox.querySelector('#hktype').value === 'cc';
          subbox.querySelector('#hkfields').innerHTML = cc
            ? '<label>מזהה טוקן</label><input id="tok" class="mono" inputmode="numeric">'
            : `<label>בנק / סניף / חשבון</label>
               <div style="display:flex;gap:6px">
                 <input id="bnk" class="mono" placeholder="בנק" style="max-width:80px">
                 <input id="brn" class="mono" placeholder="סניף" style="max-width:90px">
                 <input id="acc" class="mono" placeholder="חשבון">
               </div>`;
        };
        subbox.querySelector('#hktype').onchange = fields;
        fields();

        subbox.querySelector('#hkopen').onclick = async () => {
          const cc = subbox.querySelector('#hktype').value === 'cc';
          const body = cc
            ? { hk_type: 'cc', cc_token_id: Number(subbox.querySelector('#tok').value) }
            : { hk_type: 'bank',
                bank_number: Number(subbox.querySelector('#bnk').value),
                bank_branch: Number(subbox.querySelector('#brn').value),
                bank_account: Number(subbox.querySelector('#acc').value) };
          if (!confirm(`לפתוח הוראת קבע ל"${t.name}"?\n\nמכאן והלאה הלקוח יחויב ${money(next ? next.amount : 0)} בחודש, לפי מספר הילדים בפועל.`)) return;
          try { await api(`/tenants/${id}/subscription`, { method: 'POST', body: JSON.stringify(body) }); drawSub(); loadList(); }
          catch (e) { alert(e.message); }
        };
        return;
      }

      const ls = s.last_sync || {};
      const syncLine = ls.at
        ? (ls.ok
          ? `<span style="color:var(--good)">סונכרן ${date(ls.at)} — ${ls.children} ילדים, ${money(ls.amount)}</span>`
          : `<span style="color:var(--bad)">הסנכרון האחרון נכשל (${date(ls.at)}): ${esc(ls.error)}</span>`)
        : '<span style="color:var(--dim)">טרם סונכרן</span>';

      subbox.innerHTML = `
        ${nextLine}
        <div style="margin-bottom:10px">
          <span class="pill s-active">${s.hk_type === 'cc' ? 'אשראי' : 'הוראת קבע בנקאית'}</span>
          <span class="mono" style="color:var(--dim);margin-inline-start:8px">iCount #${s.hk_id}</span>
        </div>
        <div style="margin-bottom:12px">${syncLine}</div>
        <button class="ghost" id="hksync">עדכן את הסכום ב-iCount</button>`;

      subbox.querySelector('#hksync').onclick = async () => {
        try {
          // Always previewed first. The confirmation shows the actual number
          // rather than asking whether to run something unnamed.
          const dry = await api(`/tenants/${id}/subscription/sync`, {
            method: 'POST', body: JSON.stringify({ month: s.month }) });
          if (!confirm(`לעדכן את החיוב של "${t.name}" ל-${money(dry.amount)}?\n\n${dry.children} ילדים · ${dry.breakdown}\n\nמכאן iCount יחייב את הסכום הזה.`)) return;
          await api(`/tenants/${id}/subscription/sync`, {
            method: 'POST', body: JSON.stringify({ month: s.month, confirm: true }) });
          drawSub();
        } catch (e) { alert(e.message); }
      };
    }
    drawSub();

    // ------------------------------------------------- forgotten passwords
    const ulist = m.querySelector('#userlist');
    const ROLE = { system_admin: 'מנהל/ת מערכת', accountant: 'הנהלת חשבונות', branch_manager: 'מנהל/ת סניף' };
    api(`/tenants/${id}/users`).then(({ users }) => {
      if (!users.length) { ulist.textContent = 'אין אצל הלקוח משתמשי ניהול.'; return; }
      ulist.innerHTML = `<table><tbody>${users.map((u) => `
        <tr>
          <td>${esc(u.full_name)}</td>
          <td class="mono">${esc(u.id_number || '—')}</td>
          <td>${ROLE[u.role] || u.role}</td>
          <td>${u.must_change_password ? '<span class="pill s-trial">ממתין לבחירת סיסמה</span>' : ''}</td>
          <td style="text-align:left"><button class="ghost" data-reset="${u._id}">הנפק סיסמה</button></td>
        </tr>`).join('')}</tbody></table>`;

      ulist.querySelectorAll('[data-reset]').forEach((b) => {
        b.onclick = async () => {
          const row = b.closest('tr');
          const who = row.firstElementChild.textContent;
          if (!confirm(`להנפיק סיסמה חדשה ל"${who}"?\n\nהסיסמה הנוכחית שלהם תפסיק לעבוד מיד.`)) return;
          b.disabled = true;
          try {
            const r = await api(`/tenants/${id}/reset-password`, {
              method: 'POST', body: JSON.stringify({ user_id: b.dataset.reset }) });
            showTempPassword(r);
          } catch (e) { alert(e.message); b.disabled = false; }
        };
      });
    }).catch((e) => { ulist.innerHTML = `<span style="color:#C43E3E">${esc(e.message)}</span>`; });

    // ------------------------------------------------ moving the database
    const found = m.querySelector('#dbfound');
    /**
     * The two fields sit next to each other and hold different kinds of thing:
     * a name and an address. Typing the name into the address field produced
     * "unrecognised mongodb uri", which is true and is no help at all — the
     * value is right, it is one field to the left. So say that instead, before
     * anything is sent.
     */
    const dbBody = () => {
      const name = m.querySelector('#dbname').value.trim();
      const uri = m.querySelector('#dburi').value.trim();
      if (uri && !/^mongodb(\+srv)?:\/\//.test(uri)) {
        throw new Error(`"${uri}" הוא שם מסד, לא כתובת אשכול — הוא שייך לשדה שמעליו. את "כתובת אשכול" להשאיר ריק.`);
      }
      if (/^mongodb(\+srv)?:\/\//.test(name)) {
        throw new Error('בשדה "שם מסד" יש כתובת אשכול. שם המסד הוא החלק שאחרי הלוכסן האחרון, למשל ganflow_demo.');
      }
      return JSON.stringify({ db_name: name, db_uri: uri });
    };
    const describe = (f) => `נמצאו שם: ${f.children} ילדים · ${f.employees} עובדים · ${f.branches} סניפים · ${f.users} משתמשים (${f.collections} אוספים)`;

    m.querySelector('#dbcheck').onclick = async () => {
      try {
        const body = { ...JSON.parse(dbBody()), check: true };
        found.textContent = 'בודק…';
        const r = await api(`/tenants/${id}/database`, { method: 'PATCH', body: JSON.stringify(body) });
        found.innerHTML = describe(r.found);
      } catch (e) { found.innerHTML = `<span style="color:#C43E3E">${esc(e.message)}</span>`; }
    };

    m.querySelector('#dbmove').onclick = async () => {
      let body;
      try { body = dbBody(); }
      catch (e) { found.innerHTML = `<span style="color:#C43E3E">${esc(e.message)}</span>`; return; }
      const name = m.querySelector('#dbname').value.trim();
      if (name === t.db_name && m.querySelector('#dburi').value.trim() === (t.db_uri || '')) {
        found.textContent = 'זה כבר המסד הנוכחי.';
        return;
      }
      if (!confirm(`להעביר את "${t.name}" למסד "${name}"?\n\nמכאן והלאה הלקוח יראה את מה שיש שם.\nהמסד הנוכחי (${t.db_name}) לא נמחק ולא משתנה.`)) return;
      found.textContent = 'מעביר…';
      try {
        const r = await api(`/tenants/${id}/database`, { method: 'PATCH', body });
        found.innerHTML = `הועבר. ${describe(r.found)}`;
        loadList();
      } catch (e) { found.innerHTML = `<span style="color:#C43E3E">${esc(e.message)}</span>`; }
    };

    const susp = m.querySelector('#susp');
    if (susp) susp.onclick = async () => {
      const reason = prompt(`השהיית "${t.name}".\n\nהגן יאבד גישה מיד. המידע נשמר במלואו ולא נמחק מעצמו.\nאחרי חצי שנה אפשר יהיה למחוק אותו ידנית, אחרי ייצוא.\n\nסיבה:`);
      if (reason === null) return;
      await api(`/tenants/${id}/suspend`, { method: 'POST', body: JSON.stringify({ reason }) });
      m.remove(); loadList(); loadSummary();
    };
    const res = m.querySelector('#resume');
    if (res) res.onclick = async () => {
      await api(`/tenants/${id}/resume`, { method: 'POST' });
      m.remove(); loadList(); loadSummary();
    };
  } catch (e) {
    m.querySelector('.card').innerHTML = `<div class="err">${esc(e.message)}</div><button class="ghost" onclick="this.closest('.modal').remove()">סגור</button>`;
  }
}

// ------------------------------------------------------------------- start
(async () => {
  // Before the first paint, so no screen shows a placeholder domain and then
  // corrects itself in front of somebody reading it.
  await loadBrand();
  if (!token) return renderLogin();
  try { const s = await api('/summary'); me = null; renderApp(); }
  catch { localStorage.removeItem('gf_token'); token = ''; renderLogin(); }
})();
</script>
</body>
</html>
