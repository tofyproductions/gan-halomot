services:
  - type: web
    name: gan-halomot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    # --expose-gc: distribution jobs force a GC between branches so V8 returns
    # memory before the next Chromium launch (512MB tier headroom).
    startCommand: cd server && node --expose-gc --max-old-space-size=256 src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # AI sick-note scanning (Claude vision). Value set in the Render dashboard.
      # Without it the scan endpoint returns 501 and manual entry still works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The mailbox that is read over IMAP — the scheduled Cibus report, and
      # the טופס 101 scan, which reads the same box. Gmail needs an APP
      # PASSWORD, not the account password. Set in the Render dashboard — a
      # mail password must never live in the repo or in Mongo.
      - key: CIBUS_MAIL_USER
        sync: false
      - key: CIBUS_MAIL_PASS
        sync: false
      # Browser Web Push (VAPID keypair). Generate with:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # Set both in the Render dashboard — without them /api/push/vapid-key
      # returns null and browsers can never subscribe.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact address web push services may use to reach the sender.
      # Any "mailto:" address works — set in the Render dashboard.
      - key: VAPID_SUBJECT
        sync: false
      # Firebase service-account JSON (single-line) for native app push via FCM.
      # Without it fcm.service.js disables itself rather than throwing. Set in
      # the Render dashboard — a service-account key must never live in the repo.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      # Object storage — Cloudflare R2. The bucket holds the gan's photographs,
      # scanned contracts and תיק העובד's documents; the database keeps only the
      # key. Without all four the server falls back to storing files inline in
      # Mongo, which caps an upload at 11MB instead of 40MB — it does not break,
      # it quietly gets smaller, which is exactly the kind of thing nobody
      # notices until a manager cannot file a scan.
      #
      # THE BUCKET IS PRIVATE and must stay that way. Reads are short-lived
      # signed links minted per request. A public bucket would mean a child's
      # photograph, a ת"ז scan and a payslip reachable forever by anyone who ever
      # saw the address.
      #
      # services/storage.service.js also accepts STORAGE_ENDPOINT /
      # STORAGE_REGION / STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY /
      # STORAGE_BUCKET, which is the same thing for a provider that is not R2
      # (Supabase, S3). Set one set or the other, not both — STORAGE_* wins.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Outgoing mail. services/email.service picks up whichever of the three
      # routes is configured, so this list is longer than any one send needs:
      # SMTP is the Gmail account directly (an APP PASSWORD, never the account
      # password), Resend is the API, and GAS relays through a Google Apps
      # Script so no domain has to be verified. Without any of them a send
      # throws rather than pretending — which matters, because half of what
      # this system does ends in an email nobody is watching for.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GAS_EMAIL_URL
        sync: false
      - key: GAS_EMAIL_SECRET
        sync: false
      # SMS (SMS4Free) — a parent's one-time sign-in code, the password reset,
      # and the urgent messages a branch manager sends. SMS_USER is the phone
      # the account was registered with; SMS_SENDER is the name a parent sees.
      # One prepaid balance pays for all of it, which is why sending is capped
      # per branch per month.
      - key: SMS_KEY
        sync: false
      - key: SMS_USER
        sync: false
      - key: SMS_PASS
        sync: false
      - key: SMS_SENDER
        sync: false
      # mail-sorter — the ONE service that reads the mailboxes, shared with
      # tofy. גן takes the טופס 101 forms from it instead of opening the inbox
      # itself. Unset means the גן reads the mailbox directly again, which is
      # the double-scan this was built to stop — and a double scan is paid for
      # twice.
      - key: MAIL_SORTER_URL
        sync: false
      - key: MAIL_SORTER_TOKEN
        sync: false
      # The task board's read-only sync (routes/sync.routes.js). The route
      # closes itself entirely when this is unset, so an absent key is a
      # feature switched off rather than a hole.
      - key: TASKS_SYNC_KEY
        sync: false
    healthCheckPath: /api/health

  # ---------------------------------------------------------------------------
  # GanFlow — the demo tonight, the platform later.
  #
  # This is a SECOND service on the same repository. It exists now to carry the
  # scrambled demo for the sales evening, and it is the service that becomes the
  # control plane once there is a second customer: the code for that is already
  # merged and sits dormant until PLATFORM_MONGODB_URI is set, so upgrading it
  # is adding one variable rather than deploying anything new.
  #
  # THE ONE RULE: MONGODB_URI HERE IS NEVER THE GAN'S DATABASE.
  # This service is shown to competing gan managers. Pointing it at production
  # hands them the names, telephone numbers and medical notes of children they
  # may recognise. The database name must contain "demo" — the scrambler
  # refuses any other name, and this is the same rule one layer up.
  - type: web
    name: ganflow
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && node --expose-gc --max-old-space-size=256 src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # NOT OPTIONAL. Without it this server reads mailboxes, syncs Google
      # Sheets — which WRITES — and spends real money on AI scans, from a
      # machine nobody is watching, against whatever database it is pointed at.
      - key: DISABLE_JOBS
        value: "1"
      # The DEMO database. Set in the dashboard, never copied from gan-halomot.
      - key: MONGODB_URI
        sync: false
      # Where CUSTOMERS' databases are opened. Without it a customer falls back
      # to whatever database this process is pointed at, which is how one
      # customer's children end up in somebody else's cluster — the server
      # refuses rather than guessing.
      - key: PLATFORM_TENANT_URI
        sync: false
      # The name and address customers see. In the environment rather than in
      # the code, because the domain is bought after the software is written and
      # a name that lives in eight files is a name somebody misses one of.
      - key: PLATFORM_BRAND
        value: חלום
      - key: PLATFORM_TAGLINE
        value: מערכת לניהול גני ילדים
      - key: PLATFORM_DOMAIN
        value: dreamgan.com
      # The console's own signing key. Deliberately NOT JWT_SECRET: a gan's
      # token and a console token must not be interchangeable, or a role string
      # edited inside one customer's database is a way into every customer.
      - key: PLATFORM_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Left unset on purpose. Setting it switches on the customer registry and
      # the /console — the upgrade to a platform, not a demo. Nothing else has
      # to change on that day.
      # - key: PLATFORM_MONGODB_URI
      #   sync: false
    healthCheckPath: /api/health

  # ---------------------------------------------------------------------------
  # ג׳וב חלום — the public jobs board.
  #
  # A THIRD service on the same repository, and the reason it is a service
  # rather than a flag is worth keeping written down. The platform layer above
  # switches on INSIDE src/index.js when a variable appears; it is careful, but
  # it still means the server four gans run their day on executes a branch
  # belonging to somebody else's feature. This one is public — no login to read
  # the board, traffic arriving from paid campaigns, and personal details of
  # people who are nobody's customer — so it gets its own entry point instead.
  # src/index.js does not change by one line for it to exist, and a bug here
  # cannot reach a gan because nothing here runs there.
  #
  # THE ONE RULE HERE: MONGODB_URI AND PLATFORM_MONGODB_URI ARE NEVER SET ON
  # THIS SERVICE. It has no use for either — it never calls connectDB — and
  # src/jobgan/db.js refuses to start against any database whose name does not
  # contain "jobgan", or against one equal to MONGODB_URI. The guard is there
  # because the two connection strings differ by a few characters and mongoose
  # creates collections on demand: a paste error would point the whole board at
  # the gan's records and LOOK like it was working.
  - type: web
    name: jobgan
    runtime: node
    region: frankfurt
    plan: free
    # Server only. The front end is static files under src/jobgan/public, so
    # there is no client bundle to build — which also means a broken build in
    # client/ can never hold up a deploy of this service.
    buildCommand: cd server && npm install
    # No --expose-gc: this service renders no PDFs and launches no Chromium,
    # which is the whole reason the other two carry the flag.
    startCommand: cd server && node src/jobgan/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Its own database. The name must contain "jobgan" or the process
      # refuses to start.
      - key: JOBGAN_MONGODB_URI
        sync: false
      # Its own signing key, deliberately NOT JWT_SECRET. One key shared across
      # services means a token minted here verifies there — and a jobseeker's
      # token would be accepted by the server that runs a gan.
      - key: JOBGAN_JWT_SECRET
        generateValue: true
      # The manual review queue for a new gan's first ad. One operator, so a
      # shared secret rather than an account and a login screen.
      - key: JOBGAN_ADMIN_SECRET
        generateValue: true
      # Where the board lives, used in the links inside outgoing mail.
      - key: JOBGAN_PUBLIC_URL
        sync: false
      # The From address. ⚠️ Before the first campaign, the sending domain needs
      # its SPF/DKIM/DMARC records, or mail from a fresh domain lands in spam —
      # and the failure is silent in the worst way: a gan sees no applications
      # and concludes the board is dead, while they were there all along.
      - key: JOBGAN_MAIL_FROM
        sync: false
      # Mail provider. Whichever of these is set is what services/email.service
      # picks up; the board needs one or applications arrive with nobody told.
      - key: GAS_EMAIL_URL
        sync: false
      - key: GAS_EMAIL_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
    healthCheckPath: /api/health
