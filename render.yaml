services:
  - type: web
    name: gan-halomot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # AI sick-note scanning (Claude vision). Value set in the Render dashboard.
      # Without it the scan endpoint returns 501 and manual entry still works.
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /api/health
